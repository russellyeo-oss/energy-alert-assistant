name: Delivery migration regression tests
on:
  pull_request:
    paths:
      - direct_hotmail.py
      - 'tests/**'
      - '.github/workflows/queue-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openai beautifulsoup4 msal requests cryptography
      - run: python -m unittest discover -s tests -v
