name: Energy Alert Processor

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: probe
        options: [probe, direct, legacy]
  schedule:
    - cron: "17 * * * *"

permissions:
  issues: write
  contents: read

concurrency:
  group: energy-alert-processor
  cancel-in-progress: false

jobs:
  process-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install openai beautifulsoup4 msal requests cryptography
      - name: Validate ingestion safeguards
        run: python -m unittest discover -s tests -v
      - name: Restore encrypted Hotmail token cache
        if: inputs.mode == 'probe' || inputs.mode == 'direct' || (github.event_name == 'schedule' && vars.DIRECT_HOTMAIL_ENABLED == 'YES')
        uses: actions/cache/restore@v4
        with:
          path: .hotmail-cache/token.enc
          key: energy-hotmail-token-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: energy-hotmail-token-v1-
      - name: Probe direct personal Hotmail connection
        if: inputs.mode == 'probe'
        env:
          ENERGY_HOTMAIL_CACHE_KEY: ${{ secrets.ENERGY_HOTMAIL_CACHE_KEY }}
          ENERGY_HOTMAIL_TOKEN_B64: ${{ secrets.ENERGY_HOTMAIL_TOKEN_B64 }}
        run: python direct_hotmail.py --probe
      - name: Recover confirmed delivery failures for both energy watches
        if: inputs.mode == 'direct' || (github.event_name == 'schedule' && vars.DIRECT_HOTMAIL_ENABLED == 'YES')
        continue-on-error: true
        env:
          ENERGY_HOTMAIL_CACHE_KEY: ${{ secrets.ENERGY_HOTMAIL_CACHE_KEY }}
          ENERGY_HOTMAIL_TOKEN_B64: ${{ secrets.ENERGY_HOTMAIL_TOKEN_B64 }}
        run: python delivery_recovery.py
      - name: Process direct personal Hotmail alerts
        if: inputs.mode == 'direct' || (github.event_name == 'schedule' && vars.DIRECT_HOTMAIL_ENABLED == 'YES')
        env:
          ENERGY_HOTMAIL_CACHE_KEY: ${{ secrets.ENERGY_HOTMAIL_CACHE_KEY }}
          ENERGY_HOTMAIL_TOKEN_B64: ${{ secrets.ENERGY_HOTMAIL_TOKEN_B64 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python direct_hotmail.py
      - name: Save encrypted renewed token
        if: always() && (inputs.mode == 'probe' || inputs.mode == 'direct' || (github.event_name == 'schedule' && vars.DIRECT_HOTMAIL_ENABLED == 'YES')) && hashFiles('.hotmail-cache/token.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .hotmail-cache/token.enc
          key: energy-hotmail-token-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Process legacy Energy Alerts
        if: inputs.mode == 'legacy' || (github.event_name == 'schedule' && vars.DIRECT_HOTMAIL_ENABLED != 'YES')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python energy_alert_cloud.py
